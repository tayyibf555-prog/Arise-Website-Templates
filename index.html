<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arise Website Templates</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 48px 24px 80px;
      background: #f5f5f4;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    }
    main { max-width: 1280px; margin: 0 auto; }
    h1 { margin: 0 0 40px; font-size: 32px; letter-spacing: -0.02em; }
    .row-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 48px 0 16px; }
    h2 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
    .ty-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      padding: 0 16px;
      border-radius: 999px;
      background: #111;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.2s;
    }
    .ty-link:hover { background: #333; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    a.card { display: block; color: inherit; text-decoration: none; }
    .preview {
      position: relative;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    a.card:hover .preview { border-color: #111; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12); }
    .preview iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 1440px;
      height: 900px;
      border: 0;
      transform-origin: 0 0;
      transform: scale(var(--s, 0.4));
      pointer-events: none;
    }
    .label { margin-top: 10px; font-size: 15px; font-weight: 500; }
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Arise Website Templates</h1>
    <div id="list"></div>
  </main>

  <script src="sites/registry.js"></script>
  <script>
    const list = document.getElementById('list');
    const W = 1440;

    for (const agency of window.ARISE_REGISTRY) {
      const head = document.createElement('div');
      head.className = 'row-head';
      const h2 = document.createElement('h2');
      h2.textContent = agency.name;
      const ty = document.createElement('a');
      ty.className = 'ty-link';
      ty.href = `sites/${agency.slug}/thank-you/`;
      ty.textContent = 'View thank-you page →';
      head.append(h2, ty);
      const grid = document.createElement('div');
      grid.className = 'grid';

      for (const [id, label] of Object.entries(window.ARISE_VARIANTS)) {
        const path = `sites/${agency.slug}/${id}/`;
        const card = document.createElement('a');
        card.className = 'card';
        card.href = path;

        const preview = document.createElement('div');
        preview.className = 'preview';
        const frame = document.createElement('iframe');
        frame.src = path;
        frame.loading = 'lazy';
        frame.tabIndex = -1;
        frame.title = `${agency.name} ${label} preview`;
        // Hide the site's own scrollbar inside the thumbnail.
        frame.addEventListener('load', () => {
          try {
            const s = frame.contentDocument.createElement('style');
            s.textContent = 'html{scrollbar-width:none}html::-webkit-scrollbar{display:none}';
            frame.contentDocument.head.append(s);
          } catch {}
        });
        preview.append(frame);

        const name = document.createElement('div');
        name.className = 'label';
        name.textContent = label;

        card.append(preview, name);
        grid.append(card);
      }
      list.append(head, grid);
    }

    // Scale each 1440px-wide page down to fit its card.
    const ro = new ResizeObserver((entries) => {
      for (const { target, contentRect } of entries) {
        const s = contentRect.width / W;
        target.style.setProperty('--s', s);
        target.firstChild.style.height = `${contentRect.height / s}px`;
      }
    });
    document.querySelectorAll('.preview').forEach((p) => ro.observe(p));
  </script>
</body>
</html>
